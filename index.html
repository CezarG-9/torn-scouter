<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Torn Scouter</title>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main>
    <h1>Torn Scouter</h1>
    <p>Find Torn companies with available employee slots.</p>

    <section id="api-section">
        <h2>Connect to Torn</h2>

        <label for="api-key">Public API key</label>

        <input
                type="password"
                id="api-key"
                maxlength="16"
                autocomplete="off"
                placeholder="Enter your 16-character API key"
        >

        <button type="button" id="connect-button">
            Connect
        </button>

        <p id="status"></p>
    </section>

    <section id="finder-section" hidden>
        <h2>Company Search</h2>

        <label for="company-type">Company type</label>

        <select id="company-type">
            <option value="">Select a company type</option>
        </select>

        <label for="minimum-stars">Minimum company stars</label>

        <select id="minimum-stars" disabled>
            <option value="">Select minimum stars</option>
            <option value="1">1★</option>
            <option value="2">2★</option>
            <option value="3">3★</option>
            <option value="4">4★</option>
            <option value="5">5★</option>
            <option value="6">6★</option>
            <option value="7">7★</option>
            <option value="8">8★</option>
            <option value="9">9★</option>
            <option value="10">10★</option>
        </select>

        <button
                type="button"
                id="search-button"
                disabled
        >
            Look for vacancies
        </button>

        <p id="finder-status"></p>

        <section id="perks-section" hidden>
            <h3 id="perks-title">Company perks</h3>

            <div id="perks-list"></div>
        </section>

        <section id="results-section" hidden>
            <h3>Available companies</h3>

            <p id="results-status"></p>

            <div id="results-list"></div>
        </section>

    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
